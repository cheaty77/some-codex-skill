name: Add a skill
description: Import a skill directory from a public GitHub repository
title: "[skill] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Paste the URL of the **skill directory** below. After you submit this issue, GitHub Actions will import it into `skills/`.

  - type: input
    id: skill_url
    attributes:
      label: Skill URL
      description: Use a GitHub directory URL containing `/tree/`, not just the repository URL.
      placeholder: https://github.com/owner/repo/tree/main/path/to/skill
    validations:
      required: true
